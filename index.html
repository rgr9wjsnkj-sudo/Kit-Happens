<style>
:root{--bg:#0D0F11;--surface:#15181C;--hi:#1D2127;--line:#2A2F36;--text:#E6E8EB;--dim:#8C94A0;--acc:#B4A26B;
--glass:rgba(21,24,28,.5);--blur:16px;--logoop:.11;--logosat:.15;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg:after{content:"";position:absolute;left:50%;top:46%;width:min(80vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);background:var(--logo) center/contain no-repeat;opacity:var(--logoop);filter:saturate(var(--logosat))}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
#top{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:calc(var(--sat) + 8px) 10px 8px;border-bottom:1px solid var(--line)}
#top .tr{justify-self:end;display:flex}#top .tl{display:flex;gap:2px}
.ttl{font:700 14px var(--mono);letter-spacing:.22em;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl.small{letter-spacing:.02em;font-size:15px;font-family:inherit}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 28px}
#tabs{flex:none;display:flex;padding-bottom:var(--sab);border-top:1px solid var(--line)}
.tab{flex:1;background:none;border:0;color:var(--dim);padding:9px 0 7px;font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.tab svg{display:block;margin:0 auto 4px}.tab.on{color:var(--acc)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--acc);border-radius:9px;cursor:pointer}
.ib.dim,.x{color:var(--dim)}
.btn{background:rgba(29,33,39,.7);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
.btn.p{color:var(--acc);border-color:var(--acc)}.btn.danger{color:#d98b80}
.btn.back{display:flex;align-items:center;gap:2px;padding:6px 10px 6px 4px;color:var(--acc);border:0;background:none;font-size:16px}
.btn svg{width:18px;height:18px}
input,textarea,select{font:16px/1.3 inherit;font-family:inherit;color:var(--text);background:rgba(29,33,39,.55);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
input::placeholder,textarea::placeholder{color:#5f6772}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
input.mini:focus{border-color:var(--acc)}.srch input:focus{border:0}
label.lbl2{display:block;margin:14px 16px 5px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.f{margin:0 12px}.card{margin:0 12px 10px;border:1px solid var(--line);border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));overflow:hidden}
.pad{padding:12px 14px}.dim{color:var(--dim)}.sm{font-size:12px}.mono{font-family:var(--mono)}
.sec{display:flex;align-items:center;gap:8px;padding:14px 18px 6px}.sec i{width:7px;height:7px;border-radius:50%}.sec .r{margin-left:auto}
.lbl{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.lrow,.lrow2{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}.lrow>div:first-child,.lrow2>div:first-child{flex:1;min-width:0}
.lt{font-weight:600;font-size:17px}.ls{font:11px var(--mono);color:var(--dim);margin-top:3px}
.lact{display:flex;gap:8px;padding:0 14px 12px}.acts{display:flex;align-items:center;gap:4px}
.empty{color:var(--dim);text-align:center;padding:40px 20px}
.it{padding:10px 12px;border-top:1px solid var(--line)}.it:first-child{border-top:0}
.nm{display:flex;gap:10px;align-items:flex-start}.bar{width:3px;border-radius:2px;align-self:stretch;flex:none}
.nmt{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:rgba(29,33,39,.7);flex:none;overflow:hidden}
.qty button{width:34px;height:36px;background:none;border:0;color:var(--acc);font-size:20px;cursor:pointer}
.qty input{width:48px;border:0;background:none;text-align:center;font:700 16px var(--mono);padding:0;border-radius:0;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button,.qty input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.x{width:32px;height:36px;margin:0 -4px 0 0;flex:none}.x svg{width:18px;height:18px}
input.mini{margin-top:8px;padding:7px 10px 7px 13px;font-size:14px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}
.srch{display:flex;align-items:center;gap:8px;margin:6px 12px;padding:2px 12px;border:1px solid var(--line);border-radius:11px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.srch svg{width:18px;color:var(--dim);flex:none}.srch input{border:0;background:none;padding:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px}.chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--dim);font-size:13px;font-weight:500;cursor:pointer}
.chip i{width:7px;height:7px;border-radius:50%}.chip.on{color:var(--text);background:var(--hi);border-color:var(--acc)}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}.res:first-child{border-top:0}
.res .nmt2{flex:1;min-width:0}.res small{display:block;font:11px var(--mono);color:var(--dim);margin-top:2px}
.addb{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--hi);color:var(--acc);cursor:pointer;flex:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:0 12px}
.fld{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:0 12px;padding:11px 12px;text-align:left;border:1px solid var(--line);border-radius:9px;background:rgba(29,33,39,.55);color:var(--text);font:inherit;cursor:pointer}
.fld>div{flex:1}.fld small{display:block;color:var(--acc);font:11px var(--mono);margin-top:3px}.fld svg{color:var(--acc)}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 0 8px;font:10px var(--mono);color:var(--dim);letter-spacing:.08em}.brand img{width:46px;opacity:.85}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}#modal.on{display:flex}
.sheet{width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;background:#12151a;border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--sab))}
.sheet h3{margin:0 0 12px;font:700 15px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}.seg button{padding:9px;background:none;border:0;color:var(--dim);font:inherit;cursor:pointer}.seg button.on{background:var(--hi);color:var(--text)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin:8px 0}.cg b{font:600 11px var(--mono);color:var(--dim);padding:4px 0}
.d{aspect-ratio:1;border:0;background:none;color:var(--text);border-radius:8px;font:inherit;cursor:pointer;padding:0}.d.in{background:rgba(180,162,107,.25)}.d.end{background:var(--acc);color:#14120a;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;font-weight:600}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}#splash img{width:min(70vw,300px);animation:pop .9s ease-out both}
#splash .n{font:700 22px var(--mono);letter-spacing:.22em}#splash .rule{width:40px;height:1px;background:var(--acc)}#splash .by{color:var(--dim);font-size:14px}
#splash .ver{position:absolute;bottom:calc(26px + var(--sab));font:11px var(--mono);letter-spacing:.1em;color:var(--dim)}
#hint{position:absolute;bottom:calc(60px + var(--sab));font:11px var(--mono);letter-spacing:.14em;color:var(--acc);opacity:0;transition:opacity .4s}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
</style></head><body>

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
function rangeDays(a,b){if(!a)return[];if(!b||b<a)return[a];const out=[];let d=parse(a);const e=parse(b);while(d<=e&&out.length<400){out.push(isoOf(d));d=addDays(d,1)}return out}
function groups(days){const out=[];[...new Set(days)].sort().forEach(s=>{const last=out[out.length-1];if(last&&isoOf(addDays(last[1],1))===s)last[1]=parse(s);else out.push([parse(s),parse(s)])});return out}
const fDay=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const fDayS=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const summary=days=>groups(days).map(g=>g[0].getTime()===g[1].getTime()?fDay(g[0]):fDayS(g[0])+" to "+fDay(g[1])).join("; ");
const countText=d=>d.length===1?"1 day":d.length+" days";
const todayText=()=>new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
/* calendar logic: returns the new selection after tapping a day */
function calApply(c,iso){
  const days=new Set(c.days);
  if(c.mode==="single"){days.has(iso)?days.delete(iso):days.add(iso);return{days,anchor:null}}
  if(c.anchor){const a=c.anchor<iso?c.anchor:iso,b=c.anchor<iso?iso:c.anchor;rangeDays(a,b).forEach(x=>days.add(x));return{days,anchor:null}}
  if(days.has(iso)){days.delete(iso);return{days,anchor:null}}
  days.add(iso);return{days,anchor:iso};
}

function addCatalog(arr,c){const id=slug(c.name),e=arr.find(x=>x.id===id);if(e)e.qty=Math.min(999,e.qty+1);else arr.push({id,name:c.name,cat:c.cat,qty:1,attr:"",note:""})}
function addCustomItem(arr,name,cat){arr.push({id:"c"+Math.random().toString(36).slice(2,10),name,cat,qty:1,attr:"",note:""})}
function mergeKeeping(arr,other){other.forEach(o=>{if(!arr.some(x=>x.id===o.id))arr.push(JSON.parse(JSON.stringify(o)))})}
function grouped(arr){return CATS.concat(["Other"]).map(c=>[c,arr.filter(x=>(CATS.includes(x.cat)?x.cat:"Other")===c).sort((a,b)=>a.name.localeCompare(b.name))]).filter(g=>g[1].length)}
function searchCatalog(q,cat){
  q=q.toLowerCase().trim();const out=[];
  if(!q){CATALOG.forEach((c,i)=>{if(c.cat===cat)out.push(i)});return out.sort((a,b)=>CATALOG[a].name.localeCompare(CATALOG[b].name))}
  const tk=q.split(/\s+/);
  CATALOG.forEach((c,i)=>{const hay=(c.name+" "+c.aliases+" "+c.cat).toLowerCase();if(tk.every(t=>hay.includes(t)))out.push(i)});
  out.sort((a,b)=>{const pa=CATALOG[a].name.toLowerCase().startsWith(tk[0])?0:1,pb=CATALOG[b].name.toLowerCase().startsWith(tk[0])?0:1;return pa-pb||CATALOG[a].name.localeCompare(CATALOG[b].name)});
  return out.slice(0,40);
}

function calDraw(){const c=S.cal,first=new Date(c.y,c.m,1),off=(first.getDay()+6)%7,n=new Date(c.y,c.m+1,0).getDate();
  let g="";"MTWTFSS".split("").forEach(x=>g+=`<b>${x}</b>`);for(let i=0;i<off;i++)g+="<span></span>";
  const ends=new Set();groups([...c.days]).forEach(gr=>{ends.add(isoOf(gr[0]));ends.add(isoOf(gr[1]))});
  for(let d=1;d<=n;d++){const k=c.y+"-"+pad(c.m+1)+"-"+pad(d);let cl="d";if(c.days.has(k))cl+=ends.has(k)?" end":" in";g+=`<button class="${cl}" data-a="cday" data-d="${k}">${d}</button>`}
  const arr=[...c.days].sort(),msg=!arr.length?(c.mode==="range"?"Tap the first day, then the last day":"Tap each day you need"):summary(arr)+"  ("+countText(arr)+")"+(c.anchor?" - now tap the last day":"");
  openModal(`<h3>${c.f==="shoot"?"Shoot dates":"Prep day at kit house"}</h3><div class="seg"><button class="${c.mode==="range"?"on":""}" data-a="cmode" data-v="range">Range</button><button class="${c.mode==="single"?"on":""}" data-a="cmode" data-v="single">Single days</button></div>
  <div class="nav"><button class="ib" data-a="cnav" data-v="-1">${ic("back")}</button><span>${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</span><button class="ib" data-a="cnav" data-v="1" style="transform:scaleX(-1)">${ic("back")}</button></div>
  <div class="cg">${g}</div><div class="sm dim" style="min-height:34px">${esc(msg)}</div><div class="g2" style="margin-top:12px"><button class="btn" data-a="cclear">Clear</button><button class="btn p" data-a="cdone">Done</button></div>`)}

function toDataURL(src){return new Promise(res=>{if(!src)return res(null);if(src.startsWith("data:"))return res(src);const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);res(c.toDataURL("image/png"))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=src})}
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
async function makePDF(l){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"pt",format:"a4"}),W=595.28,H=841.89,M=40;let y=M;
  const logo=await toDataURL(A.logo);
  const lines=(s,w,size,bold)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);return doc.splitTextToSize(String(s||""),w)};
  const T=(s,x,yy,w,size,bold,col)=>{if(!s)return 0;const ls=lines(s,w,size,bold);doc.setTextColor.apply(doc,col||[0,0,0]);doc.text(ls,x,yy+size*0.82);return ls.length*size*1.2};
  const Ht=(s,w,size,bold)=>s?lines(s,w,size,bold).length*size*1.2:0;
  const hl=(yy,g)=>{doc.setDrawColor(g);doc.setLineWidth(.6);doc.line(M,yy,W-M,yy)};
  const newPage=()=>{if(doc.getNumberOfPages()>0&&(y>M||doc.getNumberOfPages()>1||true)&&started)doc.addPage();started=true;y=M};let started=false;
  const grey=[130,130,130];
  function drawGroups(gs){gs.forEach(([cat,its])=>{
      if(y>H-140)newPage();
      doc.setFillColor.apply(doc,rgb(gc(cat)));doc.rect(M,y+3,8,8,"F");
      y+=T(cat.toUpperCase(),M+14,y,W-2*M,12,true)+4;hl(y,0);y+=8;
      T("QTY",M,y,30,8,false,grey);T("ITEM",M+34,y,200,8,false,grey);T("ATTRIBUTES",285,y,125,8,false,grey);T("COMMENTS",420,y,135,8,false,grey);y+=14;
      its.forEach(it=>{const h=Math.max(Ht(it.name,235,10),Ht(it.attr,125,9),Ht(it.note,W-M-420,9),12);
        if(y+h>H-50)newPage();
        T(String(it.qty),M,y,30,10,true);T(it.name,M+34,y,235,10);T(it.attr,285,y,125,9);T(it.note,420,y,W-M-420,9);y+=h+5});
      y+=10})}
  newPage();
  if(logo)try{doc.addImage(logo,"PNG",W-M-62,M-6,62,62)}catch(e){}
  y+=T(l.title||"Untitled Project",M,y,W-2*M-74,20,true)+4;
  y+=T("Equipment List",M,y,W-2*M-74,10,false,grey)+6;
  if(l.dop)y+=T("Director of Photography: "+l.dop,M,y,W-2*M-74,12,true)+8;
  let yl=y,yr=y;
  if(l.company){yl+=T("PRODUCTION",M,yl,230,8,false,grey)+3;yl+=T(l.company,M,yl,230,10,true)+2;yl+=T(l.contact,M,yl,230,10)}
  const right=[["DATE OF ISSUE",todayText()]];
  if(l.shootDates.length)right.push(["SHOOT  ("+countText(l.shootDates)+")",summary(l.shootDates)]);
  if(l.prepDates.length)right.push(["PREP DAY AT KIT HOUSE",summary(l.prepDates)]);
  if(l.fp)right.push(["FOCUS PULLER",l.fp+(l.fpc?"  ("+l.fpc+")":"")]);
  right.forEach(r=>{yr+=T(r[0],310,yr,245,8,false,grey)+2;yr+=T(r[1],310,yr,245,10)+6});
  y=Math.max(yl,yr)+8;hl(y,150);y+=20;
  drawGroups(grouped(l.items));
  if(l.fpItems.length){if(y>H-200)newPage();y+=6;hl(y,90);y+=12;
    y+=T("FOCUS PULLER'S OWN KIT"+(l.fp?"  -  "+l.fp.toUpperCase():""),M,y,W-2*M,13,true)+3;
    y+=T("Supplied by the focus puller. Not for rental.",M,y,W-2*M,9,false,grey)+12;
    drawGroups(grouped(l.fpItems))}
  const N=doc.getNumberOfPages();for(let i=1;i<=N;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(120);doc.text((l.title||"Equipment List")+"  |  Page "+i+" of "+N+"  |  Kit Happens "+VERSION+" ("+BUILD+")",M,H-26)}
  return doc.output("blob")}
function fileName(l,ext){return(slug(l.title||"")||"gear-list")+ext}
async function giveFile(blob,name,type){

    case"kpdel":if(S.armed===d.id){S.kitPresets=S.kitPresets.filter(x=>x.id!==d.id);S.armed=null;S.openKP=null;snd("tick");persist()}else S.armed=d.id;kpModal();break;
    case"kpsave":{if(!L().items.length)break;snd("tap");const t=L().title;openModal(`<h3>Save as preset</h3><input id="kpname" placeholder="Preset name" value="${esc(t&&t!=="Untitled list"?t:"")}"><div class="sm dim" style="margin:8px 0 12px">Saved on this device. Use it as a starting point for any new list.</div><div class="g2"><button class="btn" data-a="mclose">Cancel</button><button class="btn p" data-a="kpdosave">Save</button></div>`);break}

    case"back":snd("tap");persist();S.view="home";S.cur=null;render();break;
    case"dup":{const s=S.lists.find(l=>l.id===d.id),c=JSON.parse(JSON.stringify(s));c.id=uid();c.title=(s.title||"Untitled list")+" (copy)";c.updated=Date.now();S.lists.unshift(c);S.openRow=null;snd("tick");persist();render();break}

function startSplash(){
  const el=$("#splash");let gone=false;const done=()=>{if(gone)return;gone=true;el.classList.add("off");setTimeout(()=>el.remove(),700)};
  if(!soundOn()){setTimeout(done,3300);return}
  const a=new Audio(A.splash);a.preload="auto";let started=false;
  const dur=()=>(Math.min(Math.max(isFinite(a.duration)?a.duration:3,3),8))*1000+300;
  const start=()=>{if(started)return;started=true;let p;try{a.currentTime=0;p=a.play()}catch(x){}
    if(p&&p.then)p.then(()=>{$("#hint").style.opacity=0;setTimeout(done,dur())},()=>{started=false;$("#hint").style.opacity=1});else setTimeout(done,dur())};
  start();
  setTimeout(()=>{if(!started)done()},3300);
  el.addEventListener("click",()=>{if(!started)start();else{try{a.pause()}catch(x){}done()}});
}

}
